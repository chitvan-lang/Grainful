<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 135 600 400" role="img" aria-labelledby="t">
  <!-- PLACEHOLDER artwork for Natural Wonder – Ghee. Replace with approved product photography when available. -->
  <title id="t">Natural Wonder – Ghee</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
